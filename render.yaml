# Provider tokens are entered privately during setup, never committed here.
services:
  - type: web
    name: fashiongen
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_DEPLOYMENT
        value: "true"
      - key: GENERATION_MODE
        value: live
      - key: GENERATION_PROVIDER
        value: replicate
      - key: SEARCH_MODE
        value: live
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
